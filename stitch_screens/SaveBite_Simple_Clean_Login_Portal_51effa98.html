<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SaveBite - Food Deals &amp; Surplus Rescue</title>
<!-- Tailwind CSS CDN with forms plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              primary: '#15803d',
              accent: '#ea580c',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
</head>
<body class="min-h-screen bg-[#f7f9f6] text-stone-800 antialiased flex flex-col justify-between p-4 sm:p-6 lg:p-8 font-sans selection:bg-emerald-600 selection:text-white">
<!-- Top simplified minimal bar -->
<header class="w-full max-w-md mx-auto pt-3 pb-2 flex items-center justify-between text-xs text-stone-500">
<div class="flex items-center gap-1.5 font-medium text-emerald-800">
<span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      12,000+ meals rescued daily
    </div>
<a class="hover:text-stone-700 transition-colors" href="#">Help &amp; Support</a>
</header>
<!-- BEGIN: Centered Login Card -->
<main class="w-full max-w-md mx-auto my-auto bg-white rounded-2xl border border-stone-200 shadow-sm p-6 sm:p-8">
<!-- Logo & Brand Header -->
<div class="text-center mb-6">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-700 mb-3 shadow-xs">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24">
<path d="M12 2C7.58 2 4 5.58 4 10c0 5.25 7 12 8 12s8-6.75 8-12c0-4.42-3.58-8-8-8zm0 11c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"></path>
</svg>
</div>
<h1 class="text-xl font-bold tracking-tight text-stone-900 flex items-center justify-center gap-1">
        Save<span class="text-emerald-700">Bite</span>
</h1>
<p class="text-xs text-stone-500 mt-0.5">Surplus Food Rescue &amp; Local Deals</p>
</div>
<!-- Role Switcher Toggle -->
<div class="bg-stone-100 p-1 rounded-xl flex items-center gap-1 mb-6 border border-stone-200/60" role="tablist">
<button aria-selected="true" class="flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-150 flex items-center justify-center gap-1.5 bg-white text-emerald-800 shadow-xs border border-stone-200/70" id="tab-customer" onclick="switchPortal('customer')" role="tab" type="button">
<svg class="w-4 h-4 text-emerald-700" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
        Customer
      </button>
<button aria-selected="false" class="flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-all duration-150 flex items-center justify-center gap-1.5 text-stone-600 hover:text-stone-900" id="tab-partner" onclick="switchPortal('partner')" role="tab" type="button">
<svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
        Restaurant Partner
      </button>
</div>
<!-- Title & Subtitle -->
<div class="mb-5 text-center">
<h2 class="text-xl font-bold text-stone-900 tracking-tight" id="portal-title">
        Welcome back
      </h2>
<p class="text-xs sm:text-sm text-stone-500 mt-1" id="portal-subtitle">
        Sign in to explore fresh deals and save meals near you.
      </p>
</div>
<!-- BEGIN: Simple LoginForm -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div>
<label class="block text-xs font-semibold text-stone-700 mb-1.5 uppercase tracking-wider" for="email-input" id="email-label">
          Email address
        </label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-stone-50/50 border border-stone-300 rounded-xl text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700/20 focus:border-emerald-700 transition" id="email-input" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input Field -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-xs font-semibold text-stone-700 uppercase tracking-wider" for="password-input">
            Password
          </label>
<a class="text-xs font-medium text-emerald-700 hover:text-emerald-800 hover:underline" href="#">
            Forgot password?
          </a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</span>
<input class="w-full pl-10 pr-10 py-2.5 bg-stone-50/50 border border-stone-300 rounded-xl text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700/20 focus:border-emerald-700 transition" id="password-input" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-stone-400 hover:text-stone-600 focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<svg class="w-4 h-4" fill="none" id="eye-icon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- Primary Submit Button -->
<div class="pt-1">
<button class="w-full py-2.5 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm rounded-xl transition duration-150 flex items-center justify-center gap-2 shadow-xs cursor-pointer" id="submit-button" type="submit">
          Sign In
        </button>
</div>
<!-- Demo Quick-fill button -->
<div>
<button class="w-full py-2 px-3 bg-stone-100 hover:bg-stone-200/70 border border-stone-200 text-stone-700 font-medium text-xs rounded-xl transition duration-150 flex items-center justify-center gap-1.5" id="demo-button" onclick="fillDemoData()" type="button">
<svg class="w-3.5 h-3.5 text-stone-500" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" fill-rule="evenodd"></path>
</svg>
<span id="demo-text">Quick-fill Demo Customer</span>
</button>
</div>
<!-- Sign Up link -->
<div class="text-center pt-2 text-xs text-stone-600" id="account-signup-container">
<span>Don't have an account?</span>
<a class="font-semibold text-emerald-700 hover:text-emerald-900 hover:underline" href="#">Sign up</a>
</div>
</form>
<!-- END: LoginForm -->
<!-- Card bottom divider & quick switcher link -->
<div class="mt-6 pt-5 border-t border-stone-100 text-center space-y-1.5">
<p class="text-xs text-stone-500" id="bottom-role-link">
        Restaurant owner? 
        <button class="font-semibold text-emerald-700 hover:text-emerald-800 hover:underline" onclick="switchPortal('partner')" type="button">
          Partner login →
        </button>
</p>
<p class="text-[11px] text-stone-400">
        Admin access? 
        <a class="hover:text-stone-600 underline" href="#">
          SuperAdmin
        </a>
</p>
</div>
</main>
<!-- END: Centered Login Card -->
<!-- Simple Footer -->
<footer class="w-full max-w-md mx-auto py-3 text-center text-xs text-stone-400 flex items-center justify-between">
<span>© 2025 SaveBite Technologies</span>
<div class="flex gap-3">
<a class="hover:text-stone-600 transition-colors" href="#">Privacy</a>
<a class="hover:text-stone-600 transition-colors" href="#">Terms</a>
</div>
</footer>
<!-- Interactive Switcher Script -->
<script>
    let currentPortal = 'customer';

    function switchPortal(portal) {
      currentPortal = portal;

      const tabCustomer = document.getElementById('tab-customer');
      const tabPartner = document.getElementById('tab-partner');
      const title = document.getElementById('portal-title');
      const subtitle = document.getElementById('portal-subtitle');
      const emailLabel = document.getElementById('email-label');
      const emailInput = document.getElementById('email-input');
      const submitBtn = document.getElementById('submit-button');
      const demoText = document.getElementById('demo-text');
      const signupContainer = document.getElementById('account-signup-container');
      const bottomRoleLink = document.getElementById('bottom-role-link');

      if (portal === 'customer') {
        tabCustomer.className = 'flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-150 flex items-center justify-center gap-1.5 bg-white text-emerald-800 shadow-xs border border-stone-200/70';
        tabCustomer.setAttribute('aria-selected', 'true');

        tabPartner.className = 'flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-all duration-150 flex items-center justify-center gap-1.5 text-stone-600 hover:text-stone-900';
        tabPartner.setAttribute('aria-selected', 'false');

        title.innerText = 'Welcome back';
        subtitle.innerText = 'Sign in to explore fresh deals and save meals near you.';
        emailLabel.innerText = 'Email address';
        emailInput.placeholder = 'name@example.com';
        submitBtn.innerText = 'Sign In';
        demoText.innerText = 'Quick-fill Demo Customer';
        signupContainer.innerHTML = '<span>Don\'t have an account?</span> <a href="#" class="font-semibold text-emerald-700 hover:text-emerald-900 hover:underline">Sign up</a>';
        
        bottomRoleLink.innerHTML = 'Restaurant owner? <button type="button" onclick="switchPortal(\'partner\')" class="font-semibold text-emerald-700 hover:text-emerald-800 hover:underline">Partner login &rarr;</button>';
      } else {
        tabPartner.className = 'flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-150 flex items-center justify-center gap-1.5 bg-white text-emerald-800 shadow-xs border border-stone-200/70';
        tabPartner.setAttribute('aria-selected', 'true');

        tabCustomer.className = 'flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-all duration-150 flex items-center justify-center gap-1.5 text-stone-600 hover:text-stone-900';
        tabCustomer.setAttribute('aria-selected', 'false');

        title.innerText = 'Partner Portal';
        subtitle.innerText = 'Manage your surplus inventory and incoming customer orders.';
        emailLabel.innerText = 'Partner email';
        emailInput.placeholder = 'owner@restaurant.in';
        submitBtn.innerText = 'Sign In to Partner Portal';
        demoText.innerText = 'Quick-fill Demo Baker';
        signupContainer.innerHTML = '<span>Want to partner with SaveBite?</span> <a href="#" class="font-semibold text-emerald-700 hover:text-emerald-900 hover:underline">Register restaurant</a>';
        
        bottomRoleLink.innerHTML = 'Looking for food deals? <button type="button" onclick="switchPortal(\'customer\')" class="font-semibold text-emerald-700 hover:text-emerald-800 hover:underline">Customer login &rarr;</button>';
      }
    }

    function fillDemoData() {
      const emailInput = document.getElementById('email-input');
      const passwordInput = document.getElementById('password-input');
      
      if (currentPortal === 'customer') {
        emailInput.value = 'aarav.patel@example.com';
        passwordInput.value = 'Pass@Customer2025';
      } else {
        emailInput.value = 'owner@restaurant.in';
        passwordInput.value = 'BakerSecret@2025';
      }
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password-input');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (pwd.type === 'password') {
        pwd.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;
      } else {
        pwd.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        `;
      }
    }
  </script>
</body></html>
