<style>
  /* Entrance and Micro-interaction Keyframes */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes popIn {
    0% {
      opacity: 0;
      transform: scale(0.65) translateY(-8px);
    }
    70% {
      transform: scale(1.08) translateY(0);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  @keyframes floatSlow1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -24px) scale(1.08); }
  }

  @keyframes floatSlow2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-35px, 20px) scale(1.12); }
  }

  @keyframes floatSlow3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, 30px) scale(0.95); }
  }

  @keyframes shimmerSweep {
    0% { transform: translateX(-150%) skewX(-20deg); }
    100% { transform: translateX(250%) skewX(-20deg); }
  }

  @keyframes pulseSuccess {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45); }
    70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  /* Entrance Stagger helper classes */
  .anim-fade-up {
    opacity: 0;
    animation: fadeInUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .anim-pop {
    opacity: 0;
    animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .delay-50  { animation-delay: 50ms; }
  .delay-100 { animation-delay: 100ms; }
  .delay-150 { animation-delay: 150ms; }
  .delay-200 { animation-delay: 200ms; }
  .delay-250 { animation-delay: 250ms; }
  .delay-300 { animation-delay: 300ms; }
  .delay-350 { animation-delay: 350ms; }
  .delay-400 { animation-delay: 400ms; }
  .delay-500 { animation-delay: 500ms; }

  /* Background Ambient Blobs */
  .ambient-blob-1 { animation: floatSlow1 16s ease-in-out infinite; }
  .ambient-blob-2 { animation: floatSlow2 20s ease-in-out infinite; }
  .ambient-blob-3 { animation: floatSlow3 18s ease-in-out infinite; }

  /* Shimmer button highlight */
  .btn-shimmer::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
    transform: translateX(-150%) skewX(-20deg);
  }
  .btn-shimmer:hover::after {
    animation: shimmerSweep 1.1s ease-in-out;
  }

  /* Input Fill Highlight Pulse */
  .input-flash {
    animation: pulseSuccess 0.85s ease-out;
  }

  /* Accessibility */
  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

<!-- Interactive Micro-Interactions Script -->
<script>
    let currentPortal = 'customer';
    let isTyping = false;

    function switchPortal(portal) {
      if (currentPortal === portal && !isTyping) return;
      currentPortal = portal;

      const tabCustomer = document.getElementById('tab-customer');
      const tabPartner = document.getElementById('tab-partner');
      const tabCustomerIcon = document.getElementById('tab-customer-icon');
      const tabPartnerIcon = document.getElementById('tab-partner-icon');
      const slider = document.getElementById('tab-slider');
      
      const title = document.getElementById('portal-title');
      const subtitle = document.getElementById('portal-subtitle');
      const emailLabel = document.getElementById('email-label');
      const emailInput = document.getElementById('email-input');
      const submitContent = document.getElementById('submit-content');
      const demoText = document.getElementById('demo-text');
      const signupContainer = document.getElementById('account-signup-container');
      const bottomRoleLink = document.getElementById('bottom-role-link');

      // Smooth text transition: fade out slightly, swap text, fade in
      title.style.opacity = '0';
      subtitle.style.opacity = '0';
      demoText.style.opacity = '0';

      setTimeout(() => {
        if (portal === 'customer') {
          // Slide active pill indicator to left
          slider.style.transform = 'translateX(0%)';

          tabCustomer.className = 'relative z-10 flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold transition-colors duration-200 flex items-center justify-center gap-1.5 text-emerald-800';
          tabCustomer.setAttribute('aria-selected', 'true');
          tabCustomerIcon.className = 'w-4 h-4 text-emerald-700 transition-colors duration-200';

          tabPartner.className = 'relative z-10 flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-colors duration-200 flex items-center justify-center gap-1.5 text-stone-600 hover:text-stone-900';
          tabPartner.setAttribute('aria-selected', 'false');
          tabPartnerIcon.className = 'w-4 h-4 text-stone-500 transition-colors duration-200';

          title.innerText = 'Welcome back';
          subtitle.innerText = 'Sign in to explore fresh deals and save meals near you.';
          emailLabel.innerText = 'Email address';
          emailInput.placeholder = 'name@example.com';
          submitContent.innerHTML = '<span>Sign In</span>';
          demoText.innerText = '⚡ Quick-fill Demo Customer (Sarah M.)';
          signupContainer.innerHTML = '<span>Don\'t have an account?</span> <a href="#" class="font-semibold text-emerald-700 hover:text-emerald-900 hover:underline transition-colors duration-150">Sign up</a>';
          bottomRoleLink.innerHTML = 'Restaurant owner? <button type="button" onclick="switchPortal(\'partner\')" class="font-semibold text-emerald-700 hover:text-emerald-800 hover:underline transition-colors duration-150">Partner login &rarr;</button>';
        } else {
          // Slide active pill indicator to right
          slider.style.transform = 'translateX(100%)';

          tabPartner.className = 'relative z-10 flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold transition-colors duration-200 flex items-center justify-center gap-1.5 text-emerald-800';
          tabPartner.setAttribute('aria-selected', 'true');
          tabPartnerIcon.className = 'w-4 h-4 text-emerald-700 transition-colors duration-200';

          tabCustomer.className = 'relative z-10 flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition-colors duration-200 flex items-center justify-center gap-1.5 text-stone-600 hover:text-stone-900';
          tabCustomer.setAttribute('aria-selected', 'false');
          tabCustomerIcon.className = 'w-4 h-4 text-stone-500 transition-colors duration-200';

          title.innerText = 'Partner Portal';
          subtitle.innerText = 'Sign in to manage surplus inventory and incoming orders.';
          emailLabel.innerText = 'Partner email';
          emailInput.placeholder = 'owner@restaurant.in';
          submitContent.innerHTML = '<span>Sign In to Partner Portal</span>';
          demoText.innerText = '⚡ Quick-fill Demo Baker (Vikram Joshi)';
          signupContainer.innerHTML = '<span>Want to partner with SaveBite?</span> <a href="#" class="font-semibold text-emerald-700 hover:text-emerald-900 hover:underline transition-colors duration-150">Register restaurant</a>';
          bottomRoleLink.innerHTML = 'Looking for food deals? <button type="button" onclick="switchPortal(\'customer\')" class="font-semibold text-emerald-700 hover:text-emerald-800 hover:underline transition-colors duration-150">Customer login &rarr;</button>';
        }

        // Fade in
        title.style.opacity = '1';
        subtitle.style.opacity = '1';
        demoText.style.opacity = '1';
      }, 150);
    }

    // Smooth typing simulator for demo quick-fill
    function fillDemoData() {
      if (isTyping) return;
      isTyping = true;

      const emailInput = document.getElementById('email-input');
      const passwordInput = document.getElementById('password-input');
      const demoBtn = document.getElementById('demo-button');

      const targetEmail = currentPortal === 'customer' ? 'sarah.m@example.com' : 'vikram@artisanbakery.in';
      const targetPass = currentPortal === 'customer' ? 'SaveBite2025!' : 'BakerSecret@2025';

      emailInput.value = '';
      passwordInput.value = '';
      emailInput.focus();

      let i = 0;
      const typeSpeed = 22; // ms per char

      function typeChar() {
        if (i < targetEmail.length) {
          emailInput.value += targetEmail[i];
          i++;
          setTimeout(typeChar, typeSpeed);
        } else {
          passwordInput.value = targetPass;
          
          // Celebratory pulse micro-interaction on inputs
          emailInput.classList.remove('input-flash');
          passwordInput.classList.remove('input-flash');
          void emailInput.offsetWidth; // trigger reflow
          emailInput.classList.add('input-flash');
          passwordInput.classList.add('input-flash');

          // Subtle feedback on button
          const originalText = demoBtn.querySelector('span').innerText;
          demoBtn.querySelector('span').innerText = '✓ Credentials Loaded!';
          setTimeout(() => {
            demoBtn.querySelector('span').innerText = originalText;
            isTyping = false;
          }, 1200);
        }
      }

      typeChar();
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password-input');
      const eyeIcon = document.getElementById('eye-icon');
      
      eyeIcon.style.transform = 'scale(0.8)';
      setTimeout(() => {
        if (pwd.type === 'password') {
          pwd.type = 'text';
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          `;
        } else {
          pwd.type = 'password';
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          `;
        }
        eyeIcon.style.transform = 'scale(1)';
      }, 100);
    }

    // Micro-interaction on Submit: shows loading state then success animation
    function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-button');
      const submitContent = document.getElementById('submit-content');
      
      submitBtn.disabled = true;
      submitContent.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Authenticating...</span>
      `;

      setTimeout(() => {
        submitContent.innerHTML = `
          <svg class="w-4 h-4 text-emerald-200 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
          </svg>
          <span>Welcome Back!</span>
        `;
        submitBtn.classList.add('bg-emerald-600');

        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.classList.remove('bg-emerald-600');
          if (currentPortal === 'customer') {
            submitContent.innerHTML = '<span>Sign In</span>';
          } else {
            submitContent.innerHTML = '<span>Sign In to Partner Portal</span>';
          }
        }, 1500);
      }, 900);
    }
</script>
